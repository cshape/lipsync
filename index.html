<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lip Sync</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <div class="timeline-sidebar">
      <h4>Phonemes/Visemes</h4>
      <div id="phonemeLog" class="log-content"></div>
    </div>

    <div class="main-content">
      <button id="darkModeToggle" class="dark-mode-toggle" aria-label="Toggle dark mode">
        <span class="icon-sun">&#9728;</span>
        <span class="icon-moon">&#9790;</span>
      </button>
      <div class="controls">
        <input
          type="text"
          id="textInput"
          class="text-input"
          placeholder="Enter text to speak..."
          value="Hello, how are you doing today?"
        />
        <button id="talkButton" class="talk-button">Talk</button>
      </div>
      <div class="options-row">
        <label class="toggle">
          <input type="checkbox" id="timestampsToggle" checked>
          <span class="toggle-label">Timestamps</span>
        </label>
        <div class="latency-display">
          <span class="latency-label">First audio</span>
          <span id="latencyValue" class="latency-value">—</span>
        </div>
      </div>

      <div class="face" id="face">
        <div class="hair">
          <div class="hair-strand strand-1"></div>
          <div class="hair-strand strand-2"></div>
          <div class="hair-strand strand-3"></div>
          <div class="hair-strand strand-4"></div>
          <div class="hair-strand strand-5"></div>
          <div class="hair-strand strand-6"></div>
          <div class="hair-strand strand-7"></div>
        </div>
        <div class="eyebrows">
          <div class="eyebrow left-eyebrow"></div>
          <div class="eyebrow right-eyebrow"></div>
        </div>
        <div class="eyes">
          <div class="eye-container left-eye-container">
            <div class="eyelashes left-lashes">
              <div class="lash lash-1"></div>
              <div class="lash lash-2"></div>
              <div class="lash lash-3"></div>
              <div class="lash lash-4"></div>
              <div class="lash lash-5"></div>
            </div>
            <div class="eye left-eye">
              <div class="iris left-iris">
                <div class="pupil left-pupil">
                  <div class="light left-light"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="eye-container right-eye-container">
            <div class="eyelashes right-lashes">
              <div class="lash lash-1"></div>
              <div class="lash lash-2"></div>
              <div class="lash lash-3"></div>
              <div class="lash lash-4"></div>
              <div class="lash lash-5"></div>
            </div>
            <div class="eye right-eye">
              <div class="iris right-iris">
                <div class="pupil right-pupil">
                  <div class="light right-light"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="nose"></div>
        <div class="lips-container">
          <div class="lip upper-lip"></div>
          <div class="mouth" data-letters="bmp">
            <div class="tongue left-part"></div>
            <div class="tongue right-part"></div>
            <div class="teeth upper-part"></div>
            <div class="teeth lower-part"></div>
          </div>
          <div class="lip lower-lip"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="attribution">made with love by cale</div>

  <script src="script.js"></script>
</body>
</html>
